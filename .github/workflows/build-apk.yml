# GitHub Actions workflow for Mika 0.1.40 (Liquid Glass + SenseVoice, fixed signing) — v5
# v5: cure the recurring download deaths structurally:
#  (1) gradle-wrapper.properties networkTimeout 10s -> 120s (a >10s CDN stall
#      no longer kills a download attempt outright);
#  (2) gradle/actions/setup-gradle caches the Gradle user home (distribution
#      + all dependency jars) across runs, so after one good run almost
#      nothing needs downloading again;
#  (3) the build step retries once, so a mid-build dependency download
#      flake (e.g. Build #9's kotlin-compiler-embeddable 504) self-heals.
# v4: add a dedicated "Fetch Gradle distribution (retry)" step before the
# build. On 2026-11-08 three consecutive runs (Build #5/#6/#7) all died in
# under ~30 s because the wrapper's one-shot download of
# gradle-8.11.1-bin.zip from services.gradle.org failed (read timeout,
# then HTTP 504 from the GitHub mirror) — compilation never started.
# `./gradlew --version` performs exactly that download and nothing else,
# so retrying it up to 8 times absorbs the flaky network without masking
# real compile errors (the build step itself still runs once).
# v3/v2 history: v2 aligned the Android setup with upstream Mika's own CI
# app job (setup-android@v4 with explicit android-36 packages) after the
# v1 file's setup-android@v3 step failed in run 42455210045.
# Place this file at: .github/workflows/build-apk.yml
# Trigger it manually from the repo's Actions tab; no code changes needed.
name: Build Liquid Glass APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Fetch Gradle distribution (retry)
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            echo "Attempt $i: downloading Gradle distribution"
            if ./gradlew --version; then
              echo "Gradle distribution ready"
              break
            fi
            if [ "$i" -eq 8 ]; then
              echo "Gradle distribution download failed after 8 attempts"
              exit 1
            fi
            sleep 20
          done

      - name: Build debug APK (retry once on network flake)
        run: |
          for i in 1 2; do
            echo "Build attempt $i"
            if ./gradlew :app:assembleDebug --no-daemon --stacktrace; then
              echo "Build succeeded"
              break
            fi
            if [ "$i" -eq 2 ]; then
              echo "Build failed after 2 attempts"
              exit 1
            fi
            echo "Attempt $i failed; retrying in 30s (a real compile error will fail again identically)"
            sleep 30
          done

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: mika-0.1.41-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
