# GitHub Actions workflow for Mika 0.1.39 (Liquid Glass + SenseVoice, fixed signing) — v3
# v2: align the Android setup with upstream Mika's own CI app job
# (setup-android@v4 with explicit android-36 packages). The v1 file's
# setup-android@v3 step failed in the first Actions run (2026-11-08,
# run 42455210045, failed at "Set up Android SDK" before compiling).
# Place this file at: .github/workflows/build-apk.yml
# Trigger it manually from the repo's Actions tab; no code changes needed.
name: Build Liquid Glass APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: mika-0.1.39-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
