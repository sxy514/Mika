# GitHub Actions workflow for Mika 0.1.38 + Liquid Glass (debug APK)
# Place this file at: .github/workflows/build-apk.yml
# in a repo containing the delivered 0.1.38 Liquid Glass source
# (the Drive zip "Mika-LiquidGlass-0.1.38-源码.zip", 52468798 bytes).
# Trigger it manually from the repo's Actions tab; no code changes needed.
name: Build Liquid Glass APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mika-liquid-glass-0.1.38-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
